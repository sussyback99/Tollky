<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🦉 Tollky</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <a href="#/" class="logo">🦉 Tollky</a>
    <span class="tagline">[общага без регистрации... почти]</span>
  </div>

  <div class="nav">
    [
    <a href="#/">все</a>
    <span id="subNav"></span>
    ]
    <button id="newSubBtn" class="link">+ ветка</button>
    <input id="search" placeholder="поиск...">
    <button id="newPostBtn" class="link">+ пост</button>
    <span id="userArea"></span>
  </div>

  <hr>
  <div id="feed"></div>
  <hr>
  <div class="footer">
    <a href="#/">🦉 Tollky</a> — GNU GPL sussyback99 (C) · 2026
  </div>

  <div id="modal" class="hidden">
    <div class="box">
      <h2>Новый пост</h2>
      <label>Ветка: <select id="postSub"></select></label>
      <label>Заголовок: <input id="postTitle"></label>
      <label>Текст:<br><textarea id="postText"></textarea></label>
      <label>Картинка (URL): <input id="postImage" placeholder="https://... (необязательно)"></label>
      <div class="actions">
        <button id="cancelBtn">Отмена</button>
        <button id="submitPost">Опубликовать</button>
      </div>
    </div>
  </div>

  <div id="authModal" class="hidden">
    <div class="box">
      <h2 id="authTitle">Вход</h2>
      <label>Ник: <input id="authName" autocomplete="username"></label>
      <label>Пароль: <input id="authPass" type="password" autocomplete="current-password"></label>
      <div class="actions">
        <button id="authCancel">Отмена</button>
        <button id="authSubmit">Войти</button>
      </div>
      <div style="text-align:center;margin-top:8px;font-size:11px;">
        <a href="#" id="authToggle">нет аккаунта? регистрация</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
