<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🦉 Tollky</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <a href="#/" class="logo">🦉 Tollky</a>
    <span class="tagline">[общага без регистрации]</span>
  </div>
  <div class="nav">
    [
    <a href="#/">все</a>
    <span id="subNav"></span>
    ]
    <button id="newSubBtn" class="link">+ ветка</button>
    <input id="search" placeholder="поиск...">
    <button id="newPostBtn" class="link">+ пост</button>
  </div>

  <hr>

  <div id="feed"></div>

  <hr>
  <div class="footer">
    <a href="#/">🦉 Tollky</a> — сделано на коленке · <span id="year"></span>
  </div>

  <div id="modal" class="hidden">
    <div class="box">
      <h2>Новый пост</h2>
      <label>Ветка: <select id="postSub"></select></label>
      <label>Заголовок: <input id="postTitle"></label>
      <label>Текст:<br><textarea id="postText"></textarea></label>
      <div class="actions">
        <button id="cancelBtn">Отмена</button>
        <button id="submitPost">Опубликовать</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
